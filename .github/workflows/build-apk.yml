name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. ZIP EXTRACT KARNE WALA STEP
      - name: Unzip Project Files
        run: |
          unzip video-downloader.zip
          echo "--- Extracted Folders ---"
          ls -la

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Dhyan dein: Zip extract hone ke baad folder "video-downloader" ke andar ho sakta hai
      # Isliye path mein "video-downloader/" add kiya gaya hai
      - name: Install frontend deps
        working-directory: ./video-downloader/frontend
        run: npm install

      - name: Build web
        working-directory: ./video-downloader/frontend
        run: npm run build

      - name: Add Android platform
        working-directory: ./video-downloader/frontend
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: ./video-downloader/frontend
        run: npx cap sync android

      - name: Build APK
        working-directory: ./video-downloader/frontend/android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: video-downloader-apk
          path: video-downloader/frontend/android/app/build/outputs/apk/debug/app-debug.apk
